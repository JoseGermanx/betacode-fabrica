# Fase 5 (parte determinista): tests + lint + secretos + SAST. Debe ser "required check" en main.
name: CI
on:
  workflow_call:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: hashFiles('package.json') != ''
        with: { node-version: 22, cache: npm }
      - name: Node
        if: hashFiles('package.json') != ''
        run: npm ci && (npm run lint --if-present) && npm test --if-present
      - uses: actions/setup-python@v5
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        with: { python-version: '3.12' }
      - name: Python
        if: hashFiles('requirements.txt', 'pyproject.toml') != ''
        run: |
          pip install -r requirements.txt 2>/dev/null || pip install -e .
          pip install pytest ruff
          ruff check . && pytest -q

  seguridad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secretos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: SAST (semgrep)
        run: pipx run semgrep scan --config auto --error
