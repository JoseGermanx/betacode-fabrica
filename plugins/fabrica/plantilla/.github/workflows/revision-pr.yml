# Fase 5 (parte agéntica): revisor independiente + matriz de trazabilidad en cada PR de la fábrica.
name: Fábrica — revisión y verificación del PR
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisar:
    if: startsWith(github.head_ref, 'fabrica/')
    runs-on: [self-hosted, fabrica]
    timeout-minutes: 45
    env:
      CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Node según .nvmrc
        if: hashFiles('.nvmrc') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Dependencias del proyecto
        if: hashFiles('package-lock.json') != ''
        run: npm ci

      - name: Navegador de Playwright
        if: hashFiles('playwright.config.*') != ''
        # Sin --with-deps: en AlmaLinux las librerías del sistema se instalan una vez con dnf (ver README).
        # El navegador queda en ~/.cache/ms-playwright del runner, así que solo se descarga la primera vez.
        run: npx playwright install chromium

      - name: Número de issue
        id: n
        run: echo "n=${GITHUB_HEAD_REF#fabrica/}" >> $GITHUB_OUTPUT
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: ${{ vars.FABRICA_MARKETPLACE }}   # p. ej. https://github.com/<usuario>/betacode-fabrica.git
          plugins: "fabrica@betacode"
          prompt: |
            PR #${{ github.event.pull_request.number }} del issue #${{ steps.n.outputs.n }}.
            1. Usa el subagente revisor sobre `git diff origin/main...HEAD` y publica sus hallazgos como revisión del PR.
            2. Ejecuta /fabrica:verificar ${{ steps.n.outputs.n }} y publica la matriz CA→test→resultado.
            3. Si hay hallazgos bloqueantes, pide cambios (request changes); si no, comenta "✅ Revisor: APROBADO".
          claude_args: --max-turns 60 --disallowedTools "SendMessage" --allowedTools "Read,Glob,Grep,Agent,Task,Bash(gh pr:*),Bash(gh issue:*),Bash(git:*),Bash(npm:*),Bash(node:*),Bash(npx:*),Bash(mkdir:*),Bash(pytest:*),Bash(ruff:*)"
